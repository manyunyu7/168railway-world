# 168Railway World on 168railway.com: the nginx locations for the game and its data, inside both
# server blocks of /etc/nginx/sites-enabled/168railway.com, before `location /` (19 Nov 2026).
#
# Why: `location /` limits the homepage to 5 r/s (burst 15) per visitor (zone cf_homepage). A game load asks
# for dozens of files at once, so they got 429 and the game hung on "Memuat" (8,502 refused requests from 254
# visitors on 18-19 Nov). Cloudflare does not cache .json/.wasm/.save here, so what leaves the server is
# compressed too: precompressed .gz beside the data release's large JSON (gzip_static), else gzip on the way.
#
# /studio/       the game, a symlink to /var/www/168railway-world/releases/<sha>
# /studio-data/  the dated data release (studio-data/2026-11-18 -> /var/www/168railway-data/studio-public-releases/...)
# /studio-fork/  not here: the web's Laravel route redirects it to /studio/

    location ^~ /studio/ {
        limit_req zone=cf_limit burst=200 nodelay;
        limit_req_status 429;
        # Cloudflare does not cache .wasm/.json here: compress what leaves the server
        gzip on; gzip_vary on; gzip_comp_level 5;
        gzip_types application/json application/wasm application/javascript text/css image/svg+xml;
        # hashed build files never change: the browser keeps them
        location ^~ /studio/assets/ { expires 1y; try_files $uri =404; }
        try_files $uri $uri/ /index.php?$query_string;
    }
    location ^~ /studio-data/ {
        limit_req zone=cf_limit burst=200 nodelay;
        limit_req_status 429;
        # a dated data release: precompressed .gz beside the large files, else compressed on the way out; kept a day
        gzip_static on; gzip on; gzip_vary on; gzip_comp_level 4;
        gzip_types application/json application/geo+json application/wasm application/octet-stream;
        expires 1d;
        try_files $uri =404;
    }

# Precompressed copies (run once per data release; new files only):
#   cd /var/www/168railway-data/studio-public-releases/<release>
#   find . \( -name "*.json" -o -name "*.geojson" \) -size +8k -type f | while read f; do [ -e "$f.gz" ] || gzip -k -9 "$f"; done
#
# Cloudflare (dashboard, 20 Nov 2026): Cache Rule "World: data & aset game" on zone 168railway.com,
#   (http.host eq "168railway.com" and (starts_with(http.request.uri.path, "/studio-data/") or starts_with(http.request.uri.path, "/studio/assets/")))
#   -> Eligible for cache, Edge TTL from the origin's Cache-Control (the expires lines above). /studio/ itself stays DYNAMIC.
