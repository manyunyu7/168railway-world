<!doctype html>
<html lang="id" data-theme="green">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:" />
    <meta name="tw-data" content="https://168railway.com/studio-data/2026-11-18/">
    <title>168Railway World</title>
    <meta name="description" content="Build trains around the world! A free web train building game." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="168Railway World" />
    <meta property="og:description" content="Build trains around the world!" />
    <meta property="og:url" content="https://168railway.com/studio/" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <style>.host-worlds{margin:.6rem 0;text-align:left}.host-worlds summary{cursor:pointer;font-weight:700}.host-cloud-body{max-height:min(36vh,20rem);overflow:auto}.host-worlds ul{padding:0;list-style:none}.host-worlds li,.host-save-row{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;margin:.45rem 0}.host-worlds input{font:inherit;max-width:100%}#boot-cover{position:fixed;inset:0;z-index:200;display:grid;place-content:center;justify-items:center;gap:16px;background:#f2f6fc;color:#0f1f3d;font:900 22px system-ui,sans-serif;letter-spacing:-.3px;animation:bc-gone .35s 15s forwards}#boot-cover b{color:#0b5cd5}#boot-cover .bc-mark{width:56px;height:56px;border-radius:16px;background:#0b5cd5;box-shadow:0 3px 0 #0848a8;display:grid;place-items:center}#boot-cover .bc-bar{width:140px;height:5px;border-radius:3px;background:#dde6f4;overflow:hidden}#boot-cover .bc-bar i{display:block;width:40%;height:100%;border-radius:3px;background:#0b5cd5;animation:bc-run 1.1s ease-in-out infinite}@keyframes bc-run{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}@keyframes bc-gone{to{opacity:0;visibility:hidden}}@media (prefers-reduced-motion:reduce){#boot-cover .bc-bar i{animation:none;width:100%}}</style>
  </head>
  <body>
    <div id="boot-cover" aria-hidden="true"><span class="bc-mark"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="14" rx="3"/><path d="M5 11h14M9 21l1.5-4M15 21l-1.5-4"/></svg></span><span>168Railway <b>World</b></span><span class="bc-bar"><i></i></span></div>
    <div id="game" data-nosnippet>
      <div id="dock-root"></div>
      <div id="main">
        <div id="topbar-root"></div>
        <div id="map"></div>
        <div id="tools-root"></div>
        <div id="debug-root"></div>
      </div>
    </div>
    <script nomodule src="legacy-browser.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
