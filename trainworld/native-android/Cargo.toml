[package]
name = "world-native"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
trainworld-sim = { path = "../sim", default-features = false, features = ["track-api", "demand"] }
flate2 = "1"
serde_json = "1"
serde = {version="1",features=["derive"]}
jni = "0.21"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
